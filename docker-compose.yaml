version: '3.7'

services:
  keycloakdb:
    image: postgres
    ports:
      - '${KEYCLOAKDB_PORT}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
  
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KC_DB: ${KC_DB}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - '3255:8080'
    volumes:
      - ./KeycloakTheme:/opt/keycloak/providers/
    command:
      - start-dev
    depends_on:
      - keycloakdb

  recipemanagement-db:
    image: mcr.microsoft.com/mssql/server
    restart: always
    ports:
      - '${RECIPEMANAGEMENT_DB_PORT}:1433'
    environment:
      - DB_USER=${DB_USER}
      - SA_PASSWORD=${SA_PASSWORD}
      - DB_CONTAINER_NAME=${DB_CONTAINER_NAME}
      - ACCEPT_EULA=${ACCEPT_EULA}
    volumes:
      - recipemanagement-data:/var/lib/sqlserver/data

  jaeger:
    image: jaegertracing/all-in-one:latest
#    port mappings: https://www.jaegertracing.io/docs/1.32/getting-started/
    ports:
      - "${JAEGER_PORT_1}:5775/udp"
      - "${JAEGER_PORT_2}:6831/udp"
      - "${JAEGER_PORT_3}:6832/udp"
      - "${JAEGER_PORT_4}:5778"
      - "${JAEGER_PORT_5}:16686"
      - "${JAEGER_PORT_6}:14250"
      - "${JAEGER_PORT_7}:14268"
      - "${JAEGER_PORT_8}:14269"
      - "${JAEGER_PORT_9}:9411"
        
volumes:
  # compose volumes marker - do not delete
  keycloak-data:
  recipemanagement-data:
